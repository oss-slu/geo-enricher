name: Build, Attest & Publish (SLSA Level 3)

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'app/**'
      - 'api/**'
      - '*.Dockerfile'
      - '.github/workflows/build-attest.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-app:
    name: App SLSA L3 Build & Attestation
    uses: oss-slu/oss_cicd_automation/.github/workflows/slsa-build-attest.yml@main
    with:
      image-name: ghcr.io/oss-slu/geo-enricher/app
      harbor-image: registry.oss-slu.online/geo-enricher/app
      context: .
      file: ./app.Dockerfile
      sbom-artifact-name: geo-enricher-app-sbom
      push: true
    secrets: inherit

  build-api:
    name: Api SLSA L3 Build & Attestation
    uses: oss-slu/oss_cicd_automation/.github/workflows/slsa-build-attest.yml@main
    with:
      image-name: ghcr.io/oss-slu/geo-enricher/api
      harbor-image: registry.oss-slu.online/geo-enricher/api
      context: .
      file: ./api.Dockerfile
      sbom-artifact-name: geo-enricher-api-sbom
      push: true
    secrets: inherit
